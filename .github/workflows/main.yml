name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle project
        run: |
          find . -name settings.gradle -o -name settings.gradle.kts

      - name: Build
        run: |
          P=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$P" || exit 1
          D=$(dirname "$P")
          gradle -p "$D" assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: '**/build/outputs/apk/debug/*.apk'
